<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}-Sandbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js" integrity="sha256-IyUZOUxsj9um82Kx2doWEG21E82/iZAR8A2qtAUd8xw=" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% block bottom_of_head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand bg-body-tertiary mb-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Sandbox</a>
        {% if user.is_authenticated %}
          <div class="d-flex align-items-center gap-3">
            <span class="navbar-text"><i class="bi bi-person-circle"></i> {{ user.get_username }}</span>
            <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
            </form>
          </div>
        {% endif %}
      </div>
    </nav>
    <div class="container-fluid">
      {% block contents %}
      {% endblock %}
    </div>
    {% block bottom_of_body %}{% endblock %}
  </body>
</html>
