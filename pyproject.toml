[project]
name = "sandbox"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "crispy-bootstrap5>=2026.9",
    "django~=5.2",
    "django-crispy-forms==2.7",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "pytest-cov>=7.1.0",
    "pytest-django[django]>=4.14.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

extend-exclude = [
    ".vscode",
    "__pycache__",
    "migrations",
    "templates",
    "static",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "W",
    "C4",
    "DJ",
    "DTZ",
    "UP",
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"config/*_settings.py" = ["F403", "F405"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"
